# 老铁外贸网络管理系统 - nginx 反代（vpn.example.com）
# 放置到 /etc/nginx/sites-available/，软链到 sites-enabled/ 后 nginx -t && systemctl reload nginx
#
# HTTPS 证书建议用 certbot（vpn.example.com 已指向本机 YOUR_SERVER_IP）。
# 上线前把 listen 80 的 server 保留做 Let's Encrypt HTTP-01，签发后 certbot 会自行改写。

server {
    listen 80;
    server_name vpn.example.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name vpn.example.com;

    ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;
    server_tokens off;

    # 管理面板不应随意暴露给全网：生产建议改成你的常用出口 IP / VPN 网段
    # allow 你的管理出口IP;
    # deny all;

    root /opt/openvpn-wm/web-panel/frontend/dist;
    index index.html;

    # 管理面板入口页不缓存，避免更新后浏览器继续用旧版 JS
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
    }
}
