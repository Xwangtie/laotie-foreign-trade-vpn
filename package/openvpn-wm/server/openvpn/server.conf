# 老铁外贸网络管理系统 - OpenVPN 服务端（单实例服务三 profile）

port 1194
proto udp
dev tun
topology subnet
# 动态地址池与分组互访静态段分开：普通客户从 10.8.0.10-.200 分配；
# 加入“分组互访”的客户由 CCD 分配 10.8.0.201-.250，两者永不冲突。
server 10.8.0.0 255.255.255.0 nopool
ifconfig-pool 10.8.0.10 10.8.0.200
keepalive 10 60
max-clients 100

# 客户端流量默认全走 VPN；②③ 通过 CCD push CN 路由回本地
push "redirect-gateway def1 bypass-dhcp"
push "block-ipv6"

ca /etc/openvpn/ca.crt
cert /etc/openvpn/server.crt
key /etc/openvpn/server.key
dh /etc/openvpn/dh.pem
tls-crypt /etc/openvpn/tc.key
crl-verify /etc/openvpn/crl.pem

client-config-dir /etc/openvpn/ccd
ccd-exclusive
verify-client-cert require

# 账号状态校验与生命周期
script-security 2
client-connect /etc/openvpn/scripts/client-connect.sh
client-disconnect /etc/openvpn/scripts/client-disconnect.sh
management 127.0.0.1 8989 /var/lib/openvpn-wm/mgmt.pass

status /var/log/openvpn/status.log 5
log /var/log/openvpn/openvpn.log
verb 3
mute 20

# 安全加固
cipher AES-256-GCM
data-ciphers AES-256-GCM
auth SHA256
tls-version-min 1.3
remote-cert-tls client

# 性能
tun-mtu 1500
mssfix 1400
persist-key
persist-tun
