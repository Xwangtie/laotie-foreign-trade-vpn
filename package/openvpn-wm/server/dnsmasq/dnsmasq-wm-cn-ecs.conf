# 国内域名专用 DNS 上游（监听 127.0.0.1:5354，由 dnsmasq-wm-cn.service 启动）
# 作用：给国内公共 DNS 附加 EDNS Client Subnet（中国出口前缀），
# 让 223.5.5.5 / 119.29.29.29 即使在海外 VPS 上查询，也返回中国境内 CDN 节点。
port=5354
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
domain-needed
bogus-priv
cache-size=10000

# 中国客户端所在区域前缀（按客户分布调整；示例为山东联通 27.218.15.0/24）
add-subnet=27.218.15.0/24

server=223.5.5.5
server=119.29.29.29
